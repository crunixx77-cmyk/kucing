buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:4.2.2"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        ivy {
            url 'https://github.com/crunixx77-cmyk/kucing/releases/download'
            patternLayout {
                artifact '[revision]/[artifact]-[revision].[ext]'
            }
            metadataSources {
                artifact()
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
